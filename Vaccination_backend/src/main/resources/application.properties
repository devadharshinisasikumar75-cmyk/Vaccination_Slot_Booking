spring.application.name=vaccination
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaxcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=${PORT:9000}

app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=${BREVO_SENDER_NAME:VaxCare}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.otp.hmac-secret=${OTP_HMAC_SECRET:}
app.otp.ttl-minutes=5
app.otp.max-attempts=5
app.otp.resend-wait-seconds=60

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
